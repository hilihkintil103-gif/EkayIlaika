name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VERSION_OUTPUT"
          
          if [[ "$JAVA_VERSION_OUTPUT" =~ ^1\.([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          elif [[ "$JAVA_VERSION_OUTPUT" =~ ^([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          else
            JAVA_MAJOR=""
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version must be 17 or newer, but found: '$JAVA_MAJOR'."
            exit 1
          fi
          echo "Java version verification passed: Java $JAVA_MAJOR >= 17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Temporary debug keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ -f "$KEYSTORE_PATH" ]; then
              echo "Temporary debug keystore generated successfully."
            else
              echo "Error: Failed to generate debug keystore."
              exit 1
            fi
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK existence and validity
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty (0 bytes)."
            exit 1
          fi
          echo "APK verification successful: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          mkdir -p release-asset-dir
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="android-app"
          fi
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          RUN_NUMBER="${{ github.run_number }}"
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          ASSET_PATH="release-asset-dir/${ASSET_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_filename=$ASSET_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_PATH="${{ steps.prepare-asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare-asset.outputs.asset_filename }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"
          RELEASE_NOTES="Automatically generated debug APK built by GitHub Actions."
          
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --target "$TARGET_COMMIT" \
            --notes "$RELEASE_NOTES" \
            --latest \
            "$ASSET_PATH#$ASSET_FILENAME"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish-release.outcome }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "$RELEASE_OUTCOME" == "success" ]; then
            echo "Release published successfully!"
          else
            echo "Release publishing warning: Actions artifact app-debug-apk is available as backup."
          fi
